name: ci
on: [push, pull_request]
# Matriz: Linux, Windows y macOS con Python 3.9 y 3.12 (6 trabajos). Todos los pasos usan bash y rutas con barra normal;
# .gitattributes fija eol=lf, así que el texto comparado byte a byte (js/mini.js, fixtures) es el mismo en los tres sistemas.
# Node está fijado en 22.14.0: es la versión con la que se generó y se verificó js/mini.js (la salida de
# `stripTypeScriptTypes` puede cambiar entre versiones menores; subirla es una decisión deliberada: regenerar el bundle,
# revisar el diff y cambiar este número y el de sitio.yml a la vez).
jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "22.14.0" }
      # El extra "dev" trae pytest, coverage, hypothesis, pydantic y jsonschema: sin ellos las pruebas de propiedades, de
      # Pydantic y de JSON Schema se omitirían en silencio.
      - run: pip install -e ".[bench,release,dev]"
      - name: Las dependencias de prueba están instaladas (si no, sus pruebas se omitirían en silencio)
        run: python -c "import coverage, hypothesis, jsonschema, pydantic, pytest; print('hypothesis', hypothesis.__version__, '| pydantic', pydantic.VERSION, '| jsonschema', jsonschema.__version__)"
      - run: mini check-forks
      - name: js/mini.js está al día con ts/src (generado con LF, igualdad exacta)
        run: node --no-warnings tools/build_js.mjs --check
      - run: node tests/test_js_port.mjs
      - run: npm ci --prefix ts
      - run: npm run typecheck --prefix ts
      - name: Conformidad en los tres ejecutores y en el oráculo independiente
        run: |
          python conformance/run_python.py
          node conformance/run_js.mjs
          python conformance/oraculo/ejecutar.py
      - name: Fuzz diferencial Python / js/mini.js / oráculo (60 s, semilla fija)
        run: python tools/fuzz_diferencial.py --presupuesto 60
      - name: Cobertura y pruebas (puerta - líneas de Python y de TypeScript >= 90 %; las ramas se reportan aparte)
        run: python tools/cobertura.py --json cobertura.json
      - name: Resumen de cobertura
        if: always()
        run: cat cobertura.json || true
      - name: Economía: el cálculo de JavaScript coincide con el de Python en los vectores dorados
        run: node tests/test_economia_js.mjs
      - name: Evidencia: manifiestos válidos, estudios honestos y derivados al día (ninguna cifra editada a mano)
        run: python tools/evidencia.py verificar
      - name: Tarifas: estructura y antigüedad (advertencia; caducan a los 14 días)
        run: python tools/tarifas.py verificar || true
      - run: python playground/build.py
      - name: Build and verify offline distributions
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python tools/build_release.py --output dist
          python tools/smoke_release.py --directory dist
          python sitio/construir.py
          python tools/check_site.py
# El sitio (portada, documentación y playground) se publica en
# https://mini-format.pmoluna.com desde .github/workflows/sitio.yml.
# El antiguo job `pages` se retiró: GitHub Pages no está disponible para
# repositorios privados en el plan gratuito de la organización.
