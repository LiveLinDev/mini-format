name: ci
on: [push, pull_request]
jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: pip install -e ".[bench,release,dev]"
      - run: mini check-forks
      - name: Python tests with coverage (minimum 90 %)
        run: |
          python -m coverage run --source=minifmt -m pytest -q tests experiments/generativo/tests
          python -m coverage report --fail-under=90
      - run: python conformance/run_python.py
      - run: node tests/test_js_port.mjs
      - run: npm ci --prefix ts
      - run: npm run typecheck --prefix ts
      - name: TypeScript tests with coverage (minimum 90 % of lines)
        working-directory: ts
        run: >
          node --experimental-strip-types --no-warnings --test
          --experimental-test-coverage --test-coverage-include="src/**"
          --test-coverage-lines=90 test/*.test.ts
      - run: node conformance/run_js.mjs
      - run: python playground/build.py
      - name: Build and verify offline distributions
        if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          python tools/build_release.py --output dist
          python tools/smoke_release.py --directory dist
          python sitio/construir.py
          python tools/check_site.py
# El sitio (portada, documentación y playground) se publica en
# https://mini-format.pmoluna.com desde .github/workflows/sitio.yml.
# El antiguo job `pages` se retiró: GitHub Pages no está disponible para
# repositorios privados en el plan gratuito de la organización.
