name: sitio

# Cada push a main que toque el sitio o su contenido reconstruye y publica
# https://mini-format.pmoluna.com. Los despliegues solo salen de main.
on:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - "tools/**"
      - "examples/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "setup.py"
      - "BUILD_GUIDE*.md"
      - "DOMAIN_PROFILE*.md"
      - "CHANGELOG.md"
      - "benchmark/public/**"
      - "ts/**"
      - "SPEC.md"
      - "SPEC.es.md"
      - "README.md"
      - "README.es.md"
      - "FORKING.md"
      - "FORKING.es.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTING.es.md"
      - "LICENSE"
      - "forks/**"
      - "src/minifmt/**"
      - "playground/template.html"
      - "benchmark/toon_ref/toon.bundle.js"
      - "benchmark/results/summary_12.csv"
      - "conformance/README.md"
      - "conformance/README.en.md"
      - "ts/README.md"
      - "ts/README.en.md"
      - "experiments/**"
      - "js/**"
      - "evidencia/**"
      - "docs/adr/**"
      - "conformance/cases/**"
      - ".github/workflows/sitio.yml"
  workflow_dispatch:
    inputs:
      accion:
        description: "desplegar o revertir"
        default: desplegar
        type: choice
        options: [desplegar, revertir]

concurrency:
  group: sitio-produccion
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }

      - uses: actions/setup-node@v5
        with: { node-version: "22.14.0" }

      - name: Construir
        if: ${{ github.event.inputs.accion != 'revertir' }}
        run: |
          pip install -e ".[release]"
          npm ci --prefix ts
          mini check-forks
          python sitio/construir.py
          python tools/check_site.py
          python tools/smoke_release.py --directory sitio/downloads

      - name: Llave de despliegue
        env:
          LLAVE: ${{ secrets.SITIO_SSH_KEY }}
          HUELLA: ${{ secrets.SITIO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LLAVE" > ~/.ssh/despliegue && chmod 600 ~/.ssh/despliegue
          printf '%s\n' "$HUELLA" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Publicar
        if: ${{ github.event.inputs.accion != 'revertir' }}
        # sitio/servidor/empaquetar.py define qué se sube: deja fuera los *.py de sitio/, landing.en.json,
        # animation.en.json, content/, i18n/ y servidor/ (archivos de construcción que el navegador no necesita).
        run: |
          python sitio/servidor/empaquetar.py \
          | ssh -i ~/.ssh/despliegue -p 2222 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              erick@162.243.33.172 desplegar

      - name: Revertir
        if: ${{ github.event.inputs.accion == 'revertir' }}
        run: ssh -i ~/.ssh/despliegue -p 2222 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes erick@162.243.33.172 revertir

      - name: Verificar
        run: |
          sleep 2
          fallos=0
          rutas="/ /playground/ /mesa-de-ayuda/ /en/mesa-de-ayuda/ /docs/ /docs/spec/ /docs/errors/E06/ /base.css /app.js"
          # páginas nuevas: solo se exigen al desplegar (al revertir puede volver una versión que aún no las tenía)
          if [ "${{ github.event.inputs.accion }}" != "revertir" ]; then rutas="$rutas /validacion/ /economia/ /taller/ /ejemplo/ /sima/ /flujo/"; fi
          for ruta in $rutas; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://mini-format.pmoluna.com$ruta")
            echo "$ruta -> $code"; [ "$code" = 200 ] || fallos=$((fallos+1))
          done
          [ "$fallos" -eq 0 ]
          # el sello debe corresponder a este commit: prueba de que se publicó lo que se construyó
          publicado=$(curl -s "https://mini-format.pmoluna.com/version.json" | python -c 'import sys,json; print(json.load(sys.stdin)["commit"])')
          echo "version.json -> $publicado"
          if [ "${{ github.event.inputs.accion }}" != "revertir" ]; then [ "$publicado" = "$GITHUB_SHA" ]; fi

      # Informe de publicación: 404 real (hoy nginx puede devolver soft-404: ver sitio/servidor/NGINX_404.md) y
      # comparación de version.json con este commit. Informativo: no bloquea hasta que nginx se corrija.
      - name: Informe de publicación
        if: ${{ github.event.inputs.accion != 'revertir' }}
        continue-on-error: true
        run: python tools/verificar_publicacion.py --esperado "$GITHUB_SHA"

      - name: Limpiar llave
        if: always()
        run: rm -f ~/.ssh/despliegue
