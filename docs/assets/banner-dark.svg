<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label=".mini format banner (dark)">
  <defs>
    <linearGradient id="accentGrad_dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid_dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1F2937" stroke-opacity="0.45" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="#090D16"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid_dark)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1F2937" stroke-width="1.5"/>

  <!-- Geometric .mini emblem -->
  <g transform="translate(64, 72)">
    <rect width="88" height="88" rx="22" fill="url(#accentGrad_dark)"/>
    <circle cx="26" cy="58" r="7" fill="#090D16"/>
    <rect x="40" y="26" width="8" height="38" rx="4" fill="#090D16"/>
    <rect x="54" y="26" width="8" height="38" rx="4" fill="#090D16"/>
    <rect x="68" y="34" width="8" height="30" rx="4" fill="#090D16"/>
  </g>

  <!-- Title & tagline -->
  <text x="176" y="114" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">.mini</text>
  <text x="318" y="109" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#10B981">SPEC 1.1 · DOMAIN/2 · GBNF/LARK</text>
  <text x="176" y="152" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">Lossless, delimiter-adaptive notation that beats JSON, TOON, CSV, ISON &amp; TONL on LLM tokens.</text>

  <!-- 4 Verified KPI Cards -->
  <g transform="translate(64, 198)">
    <rect x="0" y="0" width="256" height="86" rx="12" fill="#111827" stroke="#1F2937"/>
    <text x="20" y="36" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#10B981">-47.8% tokens</text>
    <text x="20" y="64" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13.5" fill="#94A3B8">1,902 public records vs JSON</text>

    <rect x="272" y="0" width="256" height="86" rx="12" fill="#111827" stroke="#1F2937"/>
    <text x="292" y="36" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#06B6D4">-58.9% batch</text>
    <text x="292" y="64" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13.5" fill="#94A3B8">182 vs 443 JSON (support triage)</text>

    <rect x="544" y="0" width="256" height="86" rx="12" fill="#111827" stroke="#1F2937"/>
    <text x="564" y="36" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#38BDF8">99.8% recovery</text>
    <text x="564" y="64" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13.5" fill="#94A3B8">vs 0.0% JSON on cut responses</text>

    <rect x="816" y="0" width="256" height="86" rx="12" fill="#111827" stroke="#1F2937"/>
    <text x="836" y="36" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#A78BFA">0 dependencies</text>
    <text x="836" y="64" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13.5" fill="#94A3B8">Python stdlib &amp; JS runtime</text>
  </g>
</svg>
