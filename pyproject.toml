[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-format"
version = "1.0.0"
description = ".mini — forkable, token-efficient notation for LLM structured outputs (reference implementation)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Adrián E. J. Palma Obispo"},
  {name = "Erick J. Palomino Santa Cruz"},
]
keywords = ["llm", "serialization", "tokens", "structured-output", "toon", "json"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
bench = ["tiktoken", "pyyaml", "matplotlib"]
dev = ["pytest"]

[project.scripts]
mini = "minifmt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
