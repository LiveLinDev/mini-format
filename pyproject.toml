[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-format"
version = "1.3.0"
description = "Build domain-specific .mini toolkits from JSON samples: prompts, parsers, validation and repair"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Adrián E. J. Palma Obispo"},
  {name = "Erick J. Palomino Santa Cruz"},
]
keywords = ["llm", "serialization", "tokens", "structured-output", "toon", "json"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
bench = ["tiktoken", "pyyaml", "matplotlib", "regex", "numpy", "jiter"]
dev = ["pytest", "coverage>=7", "pydantic>=2", "jsonschema", "hypothesis"]
release = ["build", "wheel", "markdown", "setuptools>=61"]

[project.urls]
Homepage = "https://mini-format.pmoluna.com"
Documentation = "https://mini-format.pmoluna.com/docs/"
Downloads = "https://mini-format.pmoluna.com/downloads/"

[project.scripts]
mini = "minifmt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minifmt = ["workflow.mjs"]
