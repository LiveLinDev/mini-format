# Matriz PROPUESTA para el estudio real (NO ejecutada, NO autorizada).
# 14 dominios × 4 modelos × 30 repeticiones × 4 condiciones primarias (A, B, C, D) = 6 720 llamadas primarias
# nominales; C no aplica a los modelos sin modo estructurado (llama-3.3-70b-versatile): 6 300 a ejecutar.
# Las reparaciones (A+1, B+1, C+1, D+1) son UNA llamada adicional sobre la MISMA respuesta y solo cuando la
# respuesta tiene algo que reparar. V3b añade 2 100 llamadas con límite de salida reducido.
# Antes de ejecutar: confirmar modelos y tarifas VERIFICADAS (evidencia/tarifas/tarifas.json), correr el dry-run,
# obtener la autorización del presupuesto (bloque presupuesto) y pasar --max-costo-usd.
nombre: estudio
descripcion: Estudio V2/V3b — fiabilidad de generación y recuperación ante truncamiento
semilla: 20260915
idioma: es
temperatura: 0.7
max_tokens: 8192
repeticiones: 30

tareas:
  # extracción (10 dominios)
  - ext-log     # operaciones / observabilidad
  - ext-cls     # clasificación de soporte (lista marcada con clave de conteo)
  - ext-tc      # casos de prueba de software
  - ext-ner     # anotación de entidades
  - ext-cat     # catálogo de productos
  - ext-map     # mapas conceptuales
  - ext-sum     # segmentos de resumen
  - ext-us      # historias de usuario
  - ext-a       # ítems de evaluación (lista marcada + tuplas)
  - ext-s       # ítems de encuesta
  # generativas (evaluación contra contrato)
  - gen-card    # tarjetas de estudio
  - gen-q       # cuestionario formativo
  - gen-r       # rúbricas
  - gen-code    # ejercicios de programación
brazos: [A, B, C, D, A+1, B+1, C+1, D+1]

modelos:
  - proveedor: openai
    modelo: gpt-4.1-mini
    estructurado: true
  - proveedor: anthropic
    modelo: claude-haiku-4-5
    estructurado: true
  - proveedor: groq
    modelo: llama-3.3-70b-versatile
    estructurado: false          # C y C+1 quedan «no aplicable»; además su tarifa no está verificada (el real se rechaza)
  - proveedor: groq
    modelo: openai/gpt-oss-120b
    estructurado: true           # confirmar soporte de json_schema estricto antes de ejecutar

# PRESUPUESTO: sin autorización (0). El tope de 40 USD del Charter es una propuesta, NO una autorización.
presupuesto:
  autorizado_usd: 0
  por_celda_max_usd: null
  firmado_por: ""
  fecha: ""

controles:
  aleatorizar: true
  reintentos_por_llamada: 2
  max_fallos_seguidos: 5

experimentos:
  v2:
    activo: true
  v3b:
    activo: true
    brazos: [A, B, C, D, A+1, B+1, C+1, D+1]
    repeticiones: 10
    politica_limite: comun_por_tarea
    fraccion_max_tokens: 0.5     # PROVISIONAL: política y fracción se fijan con el piloto real
  v3a:
    cortes_por_muestra: 20
    semilla: 7
    brazos: [A, B, C, D]

reparacion:
  max_rondas: 1
  incluir_entrada: false
  max_tokens_factor: 2.0
  temperatura: 0.0

estimacion:
  factor_salida: 1.15
  tasa_reparacion_esperada: 0.35
  fraccion_lineas_reparadas: 0.2
